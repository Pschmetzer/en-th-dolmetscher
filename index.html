<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EN ⇄ TH Dolmetscher</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#eef0f4; --mut:#8a90a0; --en:#3b82f6; --th:#f59e0b; --ok:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,system-ui,sans-serif; }
  header { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid #262a33; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  #status { color:var(--mut); font-size:14px; }
  .controls { display:flex; gap:12px; padding:16px 20px; flex-wrap:wrap; }
  button.mode { flex:1; min-width:220px; padding:22px; font-size:20px; font-weight:600; border:3px solid transparent; border-radius:14px; cursor:pointer; color:#fff; }
  #btnEN { background:#1e3a8a; } #btnTH { background:#78350f; }
  button.mode.active { border-color:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.15); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.8; } }
  .opts { display:flex; gap:18px; padding:0 20px 10px; color:var(--mut); font-size:14px; flex-wrap:wrap; }
  #live { margin:0 20px 12px; padding:14px 16px; background:var(--card); border-radius:10px; min-height:52px; font-size:22px; color:var(--mut); font-style:italic; }
  #log { padding:0 20px 40px; display:flex; flex-direction:column-reverse; gap:12px; }
  .entry { background:var(--card); border-radius:12px; padding:14px 18px; border-left:6px solid var(--en); }
  .entry.th { border-left-color:var(--th); }
  .orig { color:var(--mut); font-size:16px; }
  .trans { font-size:30px; font-weight:600; margin-top:6px; }
  .entry.th .trans { font-size:28px; }
  #warn { display:none; margin:0 20px 12px; padding:12px 16px; background:#4c1d1d; border-radius:10px; }
  kbd { background:#333; padding:1px 6px; border-radius:4px; font-size:13px; }
  @media (max-width:500px){ .trans{font-size:22px;} button.mode{min-width:100%;} }
</style>
</head>
<body>
<header>
  <h1>🇬🇧 EN ⇄ TH 🇹🇭 Dolmetscher</h1>
  <span id="status">Bereit</span>
</header>
<div id="warn"></div>
<div class="controls">
  <button class="mode" id="btnEN">🎙 Ich spreche (English) <kbd>E</kbd></button>
  <button class="mode" id="btnTH">🎙 พูดภาษาไทย (Thai) <kbd>T</kbd></button>
</div>
<div class="opts">
  <label><input type="checkbox" id="speak" checked> Übersetzung vorlesen</label>
  <label><input type="checkbox" id="autoswitch"> Nach jedem Satz Sprecher wechseln</label>
  <span><kbd>Leertaste</kbd> = Stopp</span>
</div>
<div id="live">…</div>
<div id="log"></div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
const statusEl = $('status'), live = $('live'), log = $('log'), warn = $('warn');
const MODES = {
  en: { rec: 'en-US', from: 'en', to: 'th', tts: 'th-TH', btn: $('btnEN') },
  th: { rec: 'th-TH', from: 'th', to: 'en', tts: 'en-US', btn: $('btnTH') },
};
let mode = null, rec = null, speaking = false, voices = [];

function showWarn(msg) { warn.style.display = 'block'; warn.innerHTML = msg; }
if (!SR) showWarn('Dieser Browser hat keine Spracherkennung. Bitte <b>Google Chrome</b> verwenden.');

// ---- Voices ----
function loadVoices() { voices = speechSynthesis.getVoices(); }
speechSynthesis.onvoiceschanged = () => {
  loadVoices();
  if (!voices.some(v => v.lang.replace('_','-').startsWith('th')))
    showWarn('Keine thailändische Stimme gefunden. macOS: Systemeinstellungen → Bedienungshilfen → Gesprochene Inhalte → Systemstimme → Stimmen verwalten → Thai (Kanya) laden.');
};
loadVoices();
function pickVoice(lang) {
  const l = lang.toLowerCase(), base = l.slice(0,2);
  return voices.find(v => v.lang.replace('_','-').toLowerCase() === l && /premium|enhanced|siri/i.test(v.name))
      || voices.find(v => v.lang.replace('_','-').toLowerCase() === l)
      || voices.find(v => v.lang.toLowerCase().startsWith(base));
}

// ---- Translation (swap backend here) ----
async function translate(text, from, to) {
  try {
    const u = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
    const r = await fetch(u);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    return j[0].map(p => p[0]).join('');
  } catch (e) {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
    const j = await r.json();
    return j.responseData.translatedText;
  }
}

// ---- Recognition ----
function startRec() {
  if (!SR || !mode || speaking) return;
  rec = new SR();
  rec.lang = MODES[mode].rec;
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) handleFinal(r[0].transcript.trim());
      else interim += r[0].transcript;
    }
    live.textContent = interim || '…';
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed') { showWarn('Mikrofon blockiert. In Chrome links in der Adresszeile erlauben.'); setMode(null); }
    else if (ev.error !== 'no-speech' && ev.error !== 'aborted') statusEl.textContent = 'Fehler: ' + ev.error;
  };
  rec.onend = () => { rec = null; if (mode && !speaking) startRec(); };  // Chrome stops after silence
  try { rec.start(); } catch {}
  statusEl.textContent = mode === 'en' ? 'Hört zu (English)…' : 'กำลังฟัง (ไทย)…';
}
function stopRec() { if (rec) { const r = rec; rec = null; r.onend = null; try { r.abort(); } catch {} } }

function setMode(m) {
  stopRec();
  speechSynthesis.cancel(); speaking = false;
  mode = (m === mode) ? null : m;
  for (const k in MODES) MODES[k].btn.classList.toggle('active', k === mode);
  live.textContent = '…';
  if (mode) startRec(); else statusEl.textContent = 'Gestoppt';
}

async function handleFinal(text) {
  if (!text) return;
  const m = MODES[mode], cur = mode;
  const entry = document.createElement('div');
  entry.className = 'entry ' + cur;
  entry.innerHTML = `<div class="orig"></div><div class="trans">…</div>`;
  entry.querySelector('.orig').textContent = text;
  log.appendChild(entry);
  live.textContent = '…';
  let out;
  try { out = await translate(text, m.from, m.to); }
  catch { entry.querySelector('.trans').textContent = '⚠️ Übersetzung fehlgeschlagen (Internet?)'; return; }
  entry.querySelector('.trans').textContent = out;
  const next = $('autoswitch').checked ? (cur === 'en' ? 'th' : 'en') : cur;
  if ($('speak').checked) speak(out, m.tts, next);
  else if (next !== mode) setMode(next);
}

function speak(text, lang, nextMode) {
  speaking = true;
  stopRec();                    // avoid the mic hearing the speaker
  statusEl.textContent = '🔊 Spricht…';
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  const v = pickVoice(lang); if (v) u.voice = v;
  u.rate = 0.95;
  const done = () => {
    speaking = false;
    if (!mode) return;
    if (nextMode !== mode) setMode(nextMode); else startRec();
  };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}

MODES.en.btn.onclick = () => setMode('en');
MODES.th.btn.onclick = () => setMode('th');
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'e' || e.key === 'E') setMode('en');
  else if (e.key === 't' || e.key === 'T') setMode('th');
  else if (e.code === 'Space') { e.preventDefault(); if (mode) setMode(mode); }
});
</script>
</body>
</html>
