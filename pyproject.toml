[project]
name = "en-th-dolmetscher"
version = "1.2"
description = "Hands-free English <-> Thai speech interpreter for macOS"
license = "MIT"
# Engine-Code: ab 3.10 (CI prüft 3.10 ungepinnt). Die Lock-Dateien requirements*.txt (numpy 2.5) und build.sh brauchen 3.12.
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Kompakter Stil: mehrere Anweisungen/Importe pro Zeile und lambda-Zuweisungen sind gewollt.
ignore = ["E401", "E701", "E702", "E731"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
