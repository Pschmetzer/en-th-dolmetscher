[project]
name = "en-th-dolmetscher"
version = "1.3"
description = "Hands-free English <-> Thai speech interpreter for macOS"
license = "MIT"
# Engine-Code: ab 3.10 (CI prüft 3.10 ungepinnt). Die Lock-Dateien requirements*.txt (numpy 2.5) und build.sh brauchen 3.12.
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Kompakter Stil: mehrere Anweisungen/Importe pro Zeile und lambda-Zuweisungen sind gewollt.
ignore = ["E401", "E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
# eingebettetes JavaScript in Python-Strings: lange Zeilen sind dort gewollt
"tests/test_runde7_web_sw.py" = ["E501"]
"tests/test_web_pwa.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# pytest-timeout: kein Test darf länger als 60 s laufen (längster heute ~4 s); hängende Threads brechen ab,
# statt den CI-Runner bis zu dessen Limit zu blockieren. Einzelne Tests heben das per @pytest.mark.timeout an.
timeout = 60
addopts = "--strict-markers -ra"
# ein als erwartet fehlschlagend markierter Test, der plötzlich besteht, soll auffallen
xfail_strict = true
markers = [
    "macos: braucht macOS-Werkzeuge (say, swiftc, Apple-Silicon-uv); läuft in CI im macOS-Job (pytest -m macos)",
]

[tool.coverage.run]
# Abdeckung der Engine-Module (CI misst sie im Linux-Lauf, Python 3.12): pytest --cov
source = ["dolmetscher", "profiles", "history_store", "correction_learning", "hwprofile", "avhelper", "numwords", "thaiparticles", "online_speakers"]

[tool.coverage.report]
show_missing = false
skip_covered = false
