# Lokale Hooks ohne Fremd-Repos: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: json-valid
        name: JSON gueltig
        entry: python3 -m json.tool --no-ensure-ascii
        language: system
        files: \.(json|webmanifest)$
        exclude: ^ios/
      - id: presets-index
        name: presets-index.json aktuell
        entry: python3 tools/make_presets_index.py --check
        language: system
        files: ^presets/
        pass_filenames: false
      - id: node-check
        name: JavaScript-Syntax (sw.js)
        entry: node --check
        language: system
        files: ^sw\.js$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^(build\.sh|build-support/.*\.sh)$
