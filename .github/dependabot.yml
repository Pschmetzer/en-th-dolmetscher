version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Die Pins hängen zusammen (PyAV, numpy, ctranslate2): nur zusammen und mit Test der App anheben.
    groups:
      python-deps:
        patterns: ["*"]
  # Playwright und axe-core für den Browser-Test (tests/web-e2e, Workflow web-a11y.yml): nur dort, nicht in der App.
  - package-ecosystem: npm
    directory: /tests/web-e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      web-e2e:
        patterns: ["*"]
