version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Die Pins hängen zusammen (PyAV, numpy, ctranslate2): nur zusammen und mit Test der App anheben.
    groups:
      python-deps:
        patterns: ["*"]
