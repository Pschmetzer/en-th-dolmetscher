version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Neue Versionen erst nach einigen Tagen vorschlagen: gelöschte oder zurückgezogene Veröffentlichungen fallen so weg.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "no-changelog"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    # Die Pins hängen zusammen (PyAV, numpy, ctranslate2): nur zusammen und mit Test der App anheben.
    groups:
      python-deps:
        patterns: ["*"]
  # Playwright und axe-core für den Browser-Test (tests/web-e2e, Workflow web-a11y.yml): nur dort, nicht in der App.
  - package-ecosystem: npm
    directory: /tests/web-e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    commit-message:
      prefix: "test"
    labels: ["dependencies", "no-changelog"]
    groups:
      web-e2e:
        patterns: ["*"]
  # Features des Dev-Containers (.devcontainer/devcontainer.json)
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "no-changelog"]
