name: Fehler melden
description: Etwas funktioniert nicht (Mac-App, iPhone-App, Browser-Version oder Engine).
title: "Fehler: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte keine persönlichen Daten, keine Gesprächsinhalte und keine API-Schlüssel eintragen.
        Sicherheitslücken bitte nicht hier, sondern nach SECURITY.md melden.
  - type: dropdown
    id: platform
    attributes:
      label: Plattform
      options:
        - Mac-App
        - iPhone / iPad
        - Browser (Web Lite)
        - Engine / Kommandozeile
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version und System
      description: Version der App (oder Commit), macOS / iOS bzw. Browser.
      placeholder: "1.2, macOS 15.2, Apple M2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert, und was hast du erwartet?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Sprachpaar Deutsch ⇄ Thai wählen
        2. Start tippen und einen Satz sagen
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Logauszug (optional)
      description: Nur die betroffenen Zeilen, vorher Namen und Pfade entfernen.
      render: text
