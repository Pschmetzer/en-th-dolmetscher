name: Funktion vorschlagen
description: Eine Idee für eine neue Funktion oder eine Verbesserung.
title: "Idee: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Idee! Schau kurz in docs/ROADMAP.md und CHANGELOG.md, ob es das schon gibt oder gesammelt wird.
  - type: dropdown
    id: platform
    attributes:
      label: Für welche Plattform?
      options:
        - Mac-App
        - iPhone / iPad
        - Browser (Web Lite)
        - Alle
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Welche Situation willst du lösen?
      description: Beschreibe die Lage (zum Beispiel „im Taxi, Telefon liegt im Halter“), nicht gleich die Lösung.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Wie könnte es aussehen?
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Mir ist klar, dass neue Netzwerkaufrufe in docs/DATENSCHUTZ.md beschrieben werden müssen.
