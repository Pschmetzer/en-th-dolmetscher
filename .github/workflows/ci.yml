name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (no models, no network, no microphone)
        run: python -m pytest -v
      - name: Lint (ruff, not blocking)
        continue-on-error: true
        run: ruff check --output-format=github dolmetscher.py profiles.py bench/
      - name: Check build script syntax
        run: bash -n build.sh
      - name: Typecheck and compile all Swift files
        run: |
          swiftc --version
          mkdir -p build
          swiftc -O -parse-as-library -o build/Dolmetscher app/*.swift

  swift-typecheck:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck Swift sources
        run: |
          swiftc --version
          swiftc -typecheck -parse-as-library app/*.swift
