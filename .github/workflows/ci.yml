name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# timeout-minutes an jedem Job: ein hängender Test oder Build blockiert den Runner nicht bis zum Standard-Limit (6 h).
jobs:
  test:
    # Reine Python-Tests auf Linux: startet ohne macOS-Warteschlange. Tests, die macOS-Werkzeuge brauchen
    # (Marker "macos": say, swiftc, setup-env.sh auf Apple Silicon), laufen im Job "macos" unten.
    name: Tests (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12: exakt die Versionen aus requirements-dev.txt (Lock-Datei mit Hashes); misst die Abdeckung
          - python: "3.12"
            pinned: true
          # 3.10: Mindestversion; die Pins (numpy 2.5 braucht >= 3.12) passen nicht, daher ungepinnt
          - python: "3.10"
            pinned: false
    steps:
      # Aktionen sind auf Commit-SHAs festgelegt (Dependabot hebt sie an).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (pinned, hash-checked)
        if: matrix.pinned
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install dependencies (unpinned, minimum Python)
        if: ${{ !matrix.pinned }}
        run: |
          sed -e 's/==.*//' -e '/^-r/d' -e '/^#/d' -e '/^ *$/d' requirements.in requirements-dev.in > "$RUNNER_TEMP/unpinned.txt"
          python -m pip install -r "$RUNNER_TEMP/unpinned.txt"
      # -rs: Gründe übersprungener Tests im Log, damit stilles Überspringen auffällt. Zeitlimit je Test: pyproject.toml.
      - name: Run tests (no models, no network, no microphone)
        if: ${{ !matrix.pinned }}
        run: python -m pytest -rs -m "not macos" --durations=10
      - name: Run tests with coverage
        if: matrix.pinned
        run: |
          python -m pytest -rs -m "not macos" --durations=10 --cov --cov-report=term --cov-fail-under=70
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  macos:
    # Alles, was macOS braucht, in einem Job (eine macOS-Maschine statt drei): Tests mit Marker "macos",
    # Typecheck und vollständige Kompilierung aller Swift-Dateien; mindestens macOS 14 (LSMinimumSystemVersion).
    name: macOS (Swift + macOS-Tests)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (pinned, hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      # Keine Auswahl (Exit-Code 5) oder ein Fehler lassen den Job scheitern; -rs zeigt doch übersprungene Tests.
      - name: Run macOS-only tests (say, swiftc, setup-env.sh)
        run: python -m pytest -rs -m macos
      - name: Typecheck Swift sources
        run: |
          swiftc --version
          swiftc -typecheck -parse-as-library app/*.swift
      - name: Compile
        run: |
          mkdir -p build
          swiftc -O -parse-as-library -o build/Dolmetscher app/*.swift

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff (version from requirements-dev.in)
        run: python -m pip install "$(grep '^ruff==' requirements-dev.in)"
      - name: Icon script compiles (app/make_icon.py)
        run: python -m py_compile app/make_icon.py
      # Alle Python-Module im Hauptordner, bench/ und tests/ sind sauber: neue Befunde lassen den Lauf scheitern.
      - name: Ruff (blocking)
        run: ruff check --output-format=github ./*.py bench/ tests/

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check build script syntax
        run: bash -n build.sh
      - name: shellcheck
        run: shellcheck build.sh

  audit:
    name: Dependency audit (not blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # requirements.txt enthält alle transitiven Pakete mit Hashes: es wird alles geprüft, nicht nur die direkten Pins.
      - name: pip-audit
        run: |
          python -m pip install "$(grep '^pip-audit==' requirements-dev.in)"
          pip-audit --disable-pip --require-hashes -r requirements.txt
