name: Pages smoke test

# Prüft die ausgelieferte Web-Version (GitHub Pages): Kern-Dateien, JSON, CSP, Service-Worker-Version, Paket-Stichprobe.
# Nach einem Push auf main wartet der Test (bis 10 Minuten), bis die Cache-Version von sw.js der im Repo entspricht;
# sonst würde er den alten Stand prüfen. Dazu wöchentlich und von Hand. Nicht blockierend: ein Pages-Ausfall
# soll keine Pull Requests aufhalten. Der lokale Teil steckt in tests/test_r23_infra_pages_smoke.py (läuft in der CI).
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - languages.json
      - presets/**
      - presets-index.json
      - i18n/**
      - tools/pages_smoke.py
      - .github/workflows/pages-smoke.yml
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse der Seite (leer: GitHub Pages dieses Repositories)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Live-Seite prüfen (not blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Smoke test
        env:
          INPUT_URL: ${{ inputs.url }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          EVENT: ${{ github.event_name }}
        run: |
          url="${INPUT_URL:-}"
          if [ -z "$url" ]; then url="https://${OWNER,,}.github.io/${REPO_NAME}/"; fi
          # Nach einem Push: auf den Deploy warten. Sonst (Zeitplan, von Hand): sofort prüfen.
          wait=0
          if [ "$EVENT" = push ]; then wait=600; fi
          echo "Prüfe $url (wait=$wait)"
          python tools/pages_smoke.py "$url" --wait "$wait"
