name: Tools

# Die Swift-Prototypen in tools/ nur prüfen, wenn sie sich ändern, plus wöchentlich (neues Xcode/SDK auf dem
# Runner): spart in jedem normalen CI-Lauf eine macOS-26-Maschine samt Warteschlange.
on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["tools/**", ".github/workflows/tools.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    # Prototypen in tools/ (macOS 26 SDK) nur typprüfen, damit sie nicht unbemerkt veralten. Nicht blockierend:
    # translate-helper braucht APIs aus SDK 26.4, der Runner kann ein älteres Xcode haben.
    name: Typecheck tools/ (macOS 26, not blocking)
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)"
          xcrun swiftc --version
      - name: apple-stt
        run: xcrun swiftc -typecheck -swift-version 5 -target arm64-apple-macosx26.0 tools/apple-stt/main.swift
      - name: translate-helper
        run: xcrun swiftc -typecheck -parse-as-library -target arm64-apple-macosx26.0 tools/translate-helper/main.swift
