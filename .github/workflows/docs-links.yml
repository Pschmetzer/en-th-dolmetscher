name: Docs links

# Relative Links in den Markdown-Dateien: blockierend (Skript, ohne Netz).
# Externe Links: lychee, wöchentlich und bei Änderungen an der Doku; nicht blockierend, weil fremde Seiten
# zeitweise ausfallen oder Anfragen von Runnern ablehnen.
on:
  pull_request:
    paths:
      - "**/*.md"
      - tools/check_doc_links.py
      - .github/workflows/docs-links.yml
  push:
    branches: [main]
    paths:
      - "**/*.md"
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal:
    name: Relative Links
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/check_doc_links.py

  external:
    name: Externe Links (lychee, not blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 429 (Ratenlimit) und 403 (blockierte Runner) zählen nicht als tot; localhost und Beispieldomains auslassen.
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --accept 200..=299,403,429
            --exclude '^https?://(localhost|127\.0\.0\.1|example\.(org|com))'
            --exclude 'github\.com/Pschmetzer/en-th-dolmetscher/(issues/new|pull/|compare/)'
            README.md CONTRIBUTING.md CHANGELOG.md SECURITY.md 'docs/**/*.md'
          fail: true
