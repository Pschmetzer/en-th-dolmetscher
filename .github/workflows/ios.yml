name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "presets/**", "languages.json", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "presets/**", "languages.json", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # iOS 26 SDK (SpeechAnalyzer, Translation) braucht Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for device (unsigned)
        working-directory: ios
        run: |
          xcodebuild build -project Dolmetscher.xcodeproj -scheme Dolmetscher \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Unit tests (Simulator)
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ids = [x["udid"] for rt, xs in sorted(d.items(), reverse=True) if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          test -n "$UDID" || { echo "kein iPhone-Simulator"; exit 1; }
          xcodebuild test -project Dolmetscher.xcodeproj -scheme Dolmetscher \
            -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/Tests.xcresult
      - name: Test-Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: ios/build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14
