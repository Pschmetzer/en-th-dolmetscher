# nginx: Server-Block für Web Lite (Beispiel; Domain, Zertifikat und Pfad anpassen, siehe docs/WEB-HOSTING.md).
server {
    listen 443 ssl;
    http2 on;
    server_name example.org;
    # ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    root /var/www/dolmetscher;
    index index.html;

    # "always": die Header gelten auch bei 404 und anderen Fehlerseiten.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    types { application/manifest+json webmanifest; }

    # Updates müssen ankommen: Seite und Service Worker nie ohne Rückfrage aus dem Cache des Browsers.
    # add_header in einem location ersetzt die oben stehenden, darum hier wiederholt.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
